<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BankMatching XLSX Uploader — SNJ</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #0f766e;
      --secondary-hover: #115e59;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --ok: #16a34a;
      --err: #dc2626;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 1120px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 22px; }
    .badge { padding: 6px 12px; border-radius: 999px; font-size: 13px; background: #e2e8f0; color: #334155; }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.err { background: #fee2e2; color: #991b1b; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .dropzone {
      border: 2px dashed #94a3b8; border-radius: 10px; padding: 36px 20px; text-align: center;
      cursor: pointer; transition: all .15s ease; background: #f8fafc;
    }
    .dropzone.dragover { border-color: var(--primary); background: #eff6ff; }
    .dropzone p { margin: 6px 0; color: var(--muted); font-size: 14px; }
    .file-list { margin-top: 14px; font-size: 14px; }
    .file-item { display: flex; justify-content: space-between; padding: 6px 10px; background: #f1f5f9; border-radius: 6px; margin-bottom: 6px; }
    .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    button {
      border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600;
      cursor: pointer; color: #fff; transition: background .15s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-preview { background: var(--primary); }
    .btn-preview:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-upload { background: var(--secondary); }
    .btn-upload:hover:not(:disabled) { background: var(--secondary-hover); }
    .status-msg { margin-top: 12px; font-size: 14px; font-weight: 500; }
    .status-msg.err { color: var(--err); }
    .status-msg.ok { color: var(--ok); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    th { background: #f8fafc; font-weight: 600; color: #334155; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; padding: 2px 7px; border-radius: 4px; background: #e0f2fe; color: #0369a1; font-size: 11px; }
    .pill.bank { background: #fef3c7; color: #92400e; }
    .meta-grid { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .meta-grid strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>BankMatching XLSX Uploader</h1>
        <small style="color: var(--muted);">Auto-detect: <code>schm_snj.grosir_invoices</code> &amp; <code>schm_snj.bank_transactions</code></small>
      </div>
      <div id="dbBadge" class="badge">Memeriksa koneksi DB...</div>
    </div>

    <div class="card">
      <div id="dropzone" class="dropzone">
        <strong>Tarik &amp; lepas file .xlsx di sini (Grosir atau Laporan Bank)</strong>
        <p>atau klik untuk memilih satu / banyak file sekaligus</p>
        <input id="fileInput" type="file" accept=".xlsx" multiple hidden />
      </div>

      <div id="fileList" class="file-list"></div>

      <div class="actions">
        <button id="btnPreview" class="btn-preview" disabled>Preview Data (Dry Run)</button>
        <button id="btnUpload" class="btn-upload" disabled>Upload &amp; Simpan ke DB</button>
      </div>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div id="results"></div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileListEl = document.getElementById('fileList');
    const btnPreview = document.getElementById('btnPreview');
    const btnUpload = document.getElementById('btnUpload');
    const statusMsg = document.getElementById('statusMsg');
    const resultsEl = document.getElementById('results');
    const dbBadge = document.getElementById('dbBadge');

    let selectedFiles = [];

    async function checkHealth() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        if (data.db && data.db.connected) {
          const gOk = data.db.has_invoices_table;
          const bOk = data.db.has_bank_table;
          dbBadge.className = (gOk && bOk) ? 'badge ok' : 'badge err';
          dbBadge.textContent = (gOk && bOk)
            ? `DB Connected: ${data.db.host} (${data.db.schema})`
            : `DB Connected (${data.db.schema}) | grosir: ${gOk ? 'OK' : 'MISSING'}, bank: ${bOk ? 'OK' : 'MISSING'}`;
        } else {
          dbBadge.className = 'badge err';
          dbBadge.textContent = `DB Offline: ${data.db?.error || 'Tidak terhubung'}`;
        }
      } catch {
        dbBadge.className = 'badge err';
        dbBadge.textContent = 'Server tidak merespons';
      }
    }
    checkHealth();

    function setFiles(files) {
      selectedFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.xlsx'));
      fileListEl.innerHTML = selectedFiles.map(f =>
        `<div class="file-item"><span>${f.name}</span><span>${(f.size / 1024).toFixed(1)} KB</span></div>`
      ).join('');
      const hasFiles = selectedFiles.length > 0;
      btnPreview.disabled = !hasFiles;
      btnUpload.disabled = !hasFiles;
      statusMsg.textContent = '';
    }

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => setFiles(e.target.files));
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      setFiles(e.dataTransfer.files);
    });

    async function submitFiles(endpoint) {
      if (!selectedFiles.length) return;
      btnPreview.disabled = true;
      btnUpload.disabled = true;
      statusMsg.className = 'status-msg';
      statusMsg.textContent = 'Memproses file...';
      resultsEl.innerHTML = '';

      const formData = new FormData();
      selectedFiles.forEach(f => formData.append('files', f));

      try {
        const res = await fetch(endpoint, { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Terjadi kesalahan');

        statusMsg.className = 'status-msg ok';
        statusMsg.textContent = data.mode === 'upload'
          ? 'Berhasil memproses dan menyimpan ke database!'
          : 'Preview berhasil (belum disimpan ke database).';
        renderResults(data.files);
      } catch (err) {
        statusMsg.className = 'status-msg err';
        statusMsg.textContent = err.message;
      } finally {
        btnPreview.disabled = false;
        btnUpload.disabled = false;
      }
    }

    function renderResults(files) {
      resultsEl.innerHTML = files.map(f => f.file_type === 'bank' ? renderBankCard(f) : renderGrosirCard(f)).join('');
    }

    function renderGrosirCard(f) {
      return `
        <div class="card">
          <h3 style="margin-top:0;"><span class="pill">GROSIR</span> ${f.filename}</h3>
          <div class="meta-grid">
            <span>Cabang: <strong>${f.branches.join(', ') || '-'}</strong></span>
            <span>Faktur: <strong>${f.invoices_count}</strong></span>
            <span>Total Baris DB: <strong>${f.rows_count}</strong></span>
            ${f.db_saved ? `<span>Tersimpan DB: <strong>${f.db_saved.rows_saved} baris</strong></span>` : ''}
          </div>
          <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">
            Sheet diproses (${f.sheets_processed.length}): ${f.sheets_processed.join(', ')}
            ${f.sheets_skipped.length ? ` | Dilewati (${f.sheets_skipped.length}): ${f.sheets_skipped.join(', ')}` : ''}
          </div>
          <table>
            <thead>
              <tr><th>Tgl</th><th>No. Faktur</th><th>Customer</th><th>Metode</th><th>Channel</th><th class="num">Nominal Bayar</th></tr>
            </thead>
            <tbody>
              ${f.sample_rows.map(r => `
                <tr>
                  <td>${r.invoice_date}</td>
                  <td>${r.invoice_no}</td>
                  <td>${r.customer_name}</td>
                  <td><span class="pill">${r.payment_group}</span></td>
                  <td>${r.bank_channel}</td>
                  <td class="num">${Number(r.payment_amount).toLocaleString('id-ID')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          ${f.rows_count > 20 ? `<p style="font-size:12px; color:var(--muted); margin-bottom:0;">Menampilkan 20 dari ${f.rows_count} baris.</p>` : ''}
        </div>
      `;
    }

    function renderBankCard(f) {
      return `
        <div class="card">
          <h3 style="margin-top:0;"><span class="pill bank">BANK</span> ${f.filename}</h3>
          <div class="meta-grid">
            <span>Bank: <strong>${f.banks.join(', ') || '-'}</strong></span>
            <span>Rekening: <strong>${f.accounts.join(', ') || '-'}</strong></span>
            <span>Total Baris DB: <strong>${f.rows_count}</strong></span>
            <span>Debet: <strong>Rp ${Number(f.total_debet).toLocaleString('id-ID')}</strong></span>
            <span>Kredit: <strong>Rp ${Number(f.total_kredit).toLocaleString('id-ID')}</strong></span>
            ${f.db_saved ? `<span>Tersimpan DB: <strong>${f.db_saved.rows_saved} baris</strong></span>` : ''}
          </div>
          <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">
            Sheet diproses (${f.sheets_processed.length}): ${f.sheets_processed.join(', ')}
            ${f.sheets_skipped.length ? ` | Dilewati (${f.sheets_skipped.length}): ${f.sheets_skipped.join(', ')}` : ''}
          </div>
          <table>
            <thead>
              <tr><th>Sheet</th><th>Section</th><th>Keterangan</th><th class="num">Debet</th><th class="num">Kredit</th><th>Kind</th></tr>
            </thead>
            <tbody>
              ${f.sample_rows.map(r => `
                <tr>
                  <td>${r.source_sheet}</td>
                  <td>${r.section || '-'}</td>
                  <td>${r.keterangan}</td>
                  <td class="num">${Number(r.debet).toLocaleString('id-ID')}</td>
                  <td class="num">${Number(r.kredit).toLocaleString('id-ID')}</td>
                  <td><span class="pill bank">${r.row_kind}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          ${f.rows_count > 20 ? `<p style="font-size:12px; color:var(--muted); margin-bottom:0;">Menampilkan 20 dari ${f.rows_count} baris.</p>` : ''}
        </div>
      `;
    }

    btnPreview.addEventListener('click', () => submitFiles('/api/preview'));
    btnUpload.addEventListener('click', () => submitFiles('/api/upload'));
  </script>
</body>
</html>
